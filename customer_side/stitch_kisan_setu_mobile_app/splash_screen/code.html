<script>
  (function initSplashScreen() {
    const bar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status-text');
    if (!bar || !statusText) return;

    const stages = [
      { width: '28%', text: 'Connecting Mandis...' },
      { width: '64%', text: 'Verifying Farm Batches...' },
      { width: '88%', text: 'Calibrating Fresh Produce...' },
      { width: '100%', text: 'Welcome to Kisan Setu' }
    ];

    let current = 0;
    const interval = setInterval(() => {
      current++;
      if (current < stages.length) {
        bar.style.width = stages[current].width;
        statusText.textContent = stages[current].text;
      } else {
        clearInterval(interval);
      }
    }, 700);
  })();
