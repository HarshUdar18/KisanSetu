</button>
</div>

<script>
  (function() {
    const cards = document.querySelectorAll('.lang-card');
    const confirmBtn = document.getElementById('confirm-text');

    const buttonTranslations = {
      en: 'Confirm & Continue',
      mr: 'खात्री करा आणि पुढे जा',
      hi: 'पुष्टि करें और जारी रखें',
      kn: 'ದೃಢೀಕರಿಸಿ ಮತ್ತು ಮುಂದುವರಿಯಿರಿ',
      te: 'నిర్ధారించి కొనసాగించండి',
      ta: 'உறுதிசெய்து தொடரவும்'
    };

    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          const indicator = c.querySelector('.active-indicator');
          const check = c.querySelector('.check-box');
          const checkIcon = check.querySelector('span');
          const badge = c.querySelector('.w-8');

          indicator.classList.add('hidden');
          check.classList.remove('bg-primary', 'text-on-primary');
          check.classList.add('bg-surface-container', 'text-outline');
          checkIcon.classList.add('opacity-0');
          badge.classList.remove('bg-primary/10', 'text-primary');
          badge.classList.add('bg-surface-container-high', 'text-on-surface-variant');
        });

        card.setAttribute('aria-checked', 'true');
        const indicator = card.querySelector('.active-indicator');
        const check = card.querySelector('.check-box');
        const checkIcon = check.querySelector('span');
        const badge = card.querySelector('.w-8');

        indicator.classList.remove('hidden');
        check.classList.add('bg-primary', 'text-on-primary');
        check.classList.remove('bg-surface-container', 'text-outline');
        checkIcon.classList.remove('opacity-0');
        badge.classList.add('bg-primary/10', 'text-primary');
        badge.classList.remove('bg-surface-container-high', 'text-on-surface-variant');

        const lang = card.dataset.lang;
        if (buttonTranslations[lang]) {
          confirmBtn.textContent = buttonTranslations[lang];
        }
      });
    });
  })();
</script></main></body></html>
