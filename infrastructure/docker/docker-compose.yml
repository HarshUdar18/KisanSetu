version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kisansetu-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kisansetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-kisansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisansetu_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kisansetu_user} -d ${POSTGRES_DB:-kisansetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kisansetu-network

  redis:
    image: redis:7-alpine
    container_name: kisansetu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kisansetu-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kisansetu-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kisansetu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kisansetu_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - kisansetu-network

  backend-monolith:
    build: ../../backend/spring-boot-application
    container_name: kisansetu-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kisansetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-kisansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisansetu_secret}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-kisansetu}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-kisansetu_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - kisansetu-network

  api-gateway:
    build: ../../services/api-gateway
    container_name: kisansetu-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BACKEND_MONOLITH_URL: http://backend-monolith:8081
      AUTH_SERVICE_URL: http://auth-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
    depends_on:
      - backend-monolith
      - auth-service
      - product-service
    networks:
      - kisansetu-network

  auth-service:
    build: ../../services/auth-service
    container_name: kisansetu-auth-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-kisansetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-kisansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisansetu_secret}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kisansetu-network

  product-service:
    build: ../../services/product-service
    container_name: kisansetu-product-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-kisansetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-kisansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisansetu_secret}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kisansetu-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  kisansetu-network:
    driver: bridge
