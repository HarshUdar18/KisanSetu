spring:
  application:
    name: kisansetu-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kisansetu_db}
    username: ${POSTGRES_USER:kisansetu_user}
    password: ${POSTGRES_PASSWORD:kisansetu_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:kisansetu}
    password: ${RABBITMQ_PASSWORD:kisansetu_secret}
    virtual-host: /

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

app:
  auth:
    otp:
      expose-in-development: ${APP_AUTH_OTP_EXPOSE_IN_DEVELOPMENT:false}
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

kisansetu:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  location:
    map:
      provider: ${MAP_PROVIDER:openstreetmap}
      tile-url: ${MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      attribution: "© OpenStreetMap contributors"
    geocoding:
      provider: ${GEOCODING_PROVIDER:nominatim}
      base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
      user-agent: ${GEOCODING_USER_AGENT:KisanSetu/1.0 (contact@kisansetu.local)}
      enabled: ${GEOCODING_ENABLED:true}
      minimum-interval-ms: ${GEOCODING_MIN_INTERVAL_MS:1100}
      cache-ttl-hours: ${GEOCODING_CACHE_TTL_HOURS:168}
    routing:
      provider: ${ROUTING_PROVIDER:osrm}
      base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
      enabled: ${ROUTING_ENABLED:true}
      cache-ttl-hours: ${ROUTING_CACHE_TTL_HOURS:3}
    nearby:
      database-provider: postgis

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.kisansetu: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
