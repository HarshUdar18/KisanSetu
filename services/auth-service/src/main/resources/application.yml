server:
  port: ${PORT:8082}

spring:
  application:
    name: kisansetu-auth-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kisansetu_db}?currentSchema=auth_db
    username: ${POSTGRES_USER:kisansetu_user}
    password: ${POSTGRES_PASSWORD:kisansetu_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_db
  flyway:
    enabled: true
    schemas: auth_db
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:kisansetu}
    password: ${RABBITMQ_PASSWORD:kisansetu_secret}

kisansetu:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  auth:
    otp:
      expose-in-development: ${APP_AUTH_OTP_EXPOSE_IN_DEVELOPMENT:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
