server:
  port: ${PORT:8080}

spring:
  application:
    name: kisansetu-api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Phase 1 Strangler Fig: Route domain prefixes to extracted services when enabled,
        # falling back to BACKEND_MONOLITH_URL (default http://localhost:8081)
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: ${USER_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/users/**,/api/v1/customer/**

        - id: farmer-kyc-produce-demand
          uri: ${FARMER_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/farmer/**,/api/v1/kyc/**,/api/v1/demands/**,/api/v1/settlements/**

        - id: product-catalog-pricing
          uri: ${PRODUCT_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/prices/**,/api/v1/service-areas/**

        - id: cart-weekly-subscription
          uri: ${CART_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/cart/**,/api/v1/weekly-cart/**,/api/v1/subscriptions/**

        - id: order-payment-tracking
          uri: ${ORDER_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/orders/**,/api/v1/payments/**,/api/v1/tracking/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/admin/**

        - id: monolith-fallback
          uri: ${BACKEND_MONOLITH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
