server:
  port: ${PORT:8080}

spring:
  application:
    name: kisansetu-api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/auth/**

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/prices/**,/api/v1/service-areas/**,/api/v1/admin/categories/**

        - id: kyc-service
          uri: ${KYC_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/kyc/**,/api/v1/admin/kyc/**

        - id: user-service
          uri: ${USER_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/users/**,/api/v1/addresses/**,/api/v1/customer/**

        - id: farmer-produce-demand-settlement
          uri: ${FARMER_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/farmer/**,/api/v1/produce/**,/api/v1/demands/**,/api/v1/settlements/**

        - id: cart-weekly-subscription
          uri: ${CART_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/cart/**,/api/v1/weekly-carts/**,/api/v1/subscriptions/**

        - id: order-payment-tracking
          uri: ${ORDER_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/orders/**,/api/v1/payments/**

        - id: operations-analytics
          uri: ${OPERATIONS_SERVICE_URL:${BACKEND_MONOLITH_URL:http://localhost:8081}}
          predicates:
            - Path=/api/v1/fpos/**,/api/v1/warehouses/**,/api/v1/inventory/**,/api/v1/collections/**,/api/v1/quality/**,/api/v1/logistics/**,/api/v1/notifications/**,/api/v1/support/**,/api/v1/coupons/**,/api/v1/farmer-store/**,/api/v1/schemes/**,/api/v1/weather/**,/api/v1/admin/**

        - id: monolith-fallback
          uri: ${BACKEND_MONOLITH_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
