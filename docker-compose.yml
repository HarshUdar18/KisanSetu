version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: kisansetu-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kisansetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-kisansetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisansetu_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kisansetu_user} -d ${POSTGRES_DB:-kisansetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kisansetu-network

  redis:
    image: redis:7-alpine
    container_name: kisansetu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kisansetu-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kisansetu-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kisansetu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-kisansetu_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - kisansetu-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  kisansetu-network:
    driver: bridge
